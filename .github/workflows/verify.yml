name: Verify portable skills
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run build
      - name: Reject generated drift
        run: git diff --exit-code -- skills plugins plugin.json .claude-plugin tooling/generated-files.json
      - uses: actions/upload-artifact@v4
        with:
          name: avi-skills-release-artifacts
          path: dist/
  release-support:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run release:check
